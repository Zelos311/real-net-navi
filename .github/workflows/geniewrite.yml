name: GenieWoman Write Gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  write-file:
    if: >
      github.event.issue.user.login == 'Zelos311' &&
      github.event.issue.title == 'GENIEWRITE'
    runs-on: ubuntu-latest

    steps:
      - name: Process GenieWoman write request
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            let request;
            try {
              request = JSON.parse(body);
            } catch (err) {
              core.setFailed("Issue body is not valid JSON.");
              return;
            }

            const path = request.path;
            const content = request.content;
            const message = request.message || "GenieWoman repository update";

            if (
              typeof path !== "string" ||
              typeof content !== "string" ||
              path.length === 0 ||
              path.startsWith("/") ||
              path.includes("..") ||
              path.startsWith(".github/")
            ) {
              core.setFailed("Invalid or protected file path.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let sha;

            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path
              });

              if (!Array.isArray(existing.data)) {
                sha = existing.data.sha;
              }
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
            }

            const params = {
              owner,
              repo,
              path,
              message,
              content: Buffer.from(content, "utf8").toString("base64")
            };

            if (sha) {
              params.sha = sha;
            }

            const result = await github.rest.repos.createOrUpdateFileContents(params);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `✅ GenieWoman write completed.\n\nCommit: ${result.data.commit.sha}`
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: context.issue.number,
              state: "closed"
            });
